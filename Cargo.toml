[package]
name = "rustyfications"
version = "0.1.12-alpha"
edition = "2021"
authors = ["bzglve"]

[dependencies]
# gui
gtk = { version = "^0.11", package = "gtk4" }
gtk-layer-shell = { version = "^0.8", package = "gtk4-layer-shell" }
adw = { version = "^0.9", package = "libadwaita", features = ["v1_8"] }

# logging
log = "0.4"
env_logger = "0.11"
sys_logger = { version = "2.1", package = "systemd-journal-logger" }

# common
futures = "0.3"
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
time = { version = "0.3", features = ["local-offset"] }
zbus = "4.4"
